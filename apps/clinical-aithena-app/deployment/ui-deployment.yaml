apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-aithena-ui
  namespace: clinical-aithena
  labels:
    app: clinical-aithena-ui
    component: ui
spec:
  replicas: 2  # Run 2 replicas for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero-downtime deployments
  selector:
    matchLabels:
      app: clinical-aithena-ui
  template:
    metadata:
      labels:
        app: clinical-aithena-ui
        component: ui
    spec:
      containers:
      - name: ui
        image: polusai/ctaithena-ui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        
        # Resource allocation
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "256Mi"
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: clinical-aithena-ui-config
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /gardian
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /gardian
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Pod-level security context
      securityContext:
        fsGroup: 1001
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      
      # Affinity rules to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clinical-aithena-ui
              topologyKey: kubernetes.io/hostname

