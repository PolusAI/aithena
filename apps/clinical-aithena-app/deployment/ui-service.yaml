apiVersion: v1
kind: Service
metadata:
  name: clinical-aithena-ui
  namespace: clinical-aithena
  labels:
    app: clinical-aithena-ui
    component: ui
spec:
  type: ClusterIP  # Internal cluster access only
  ports:
  - port: 80          # Service port (external)
    targetPort: 3000  # Container port (internal)
    protocol: TCP
    name: http
  selector:
    app: clinical-aithena-ui
  sessionAffinity: None

