[project]
name = "clinical-aithena-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nicholas-schaub", email = "nicholas.j.schaub@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "aio-pika>=9.0.0",
    "aiohttp>=3.13.2",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "nltk>=3.8.0",
    "openai>=1.0.0",
    "orjson>=3.9.0",
    "pgvector>=0.2.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "sqlmodel>=0.0.27",
    "tenacity>=9.0.0",
    "typer>=0.20.1",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
ct-aithena = "polus.aithena.clinical_aithena.cli.main:main"

[tool.uv.sources]
en_core_web_md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
ask-aithena-agent = { workspace = true }
aithena-embeddings = { path = "../../embeddings" }

[tool.hatch.build.targets.sdist]
include = ["src/polus"]

[tool.hatch.build.targets.wheel]
include = ["src/polus"]

[tool.hatch.build.targets.wheel.sources]
"src/polus" = "polus"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "black>=25.11.0",
    "duckdb-engine>=0.17.0",
    "httpx>=0.27.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.8.0",
    "torch>=2.8.0",
    "transformers>=4.57.6",
]

[tool.pytest.ini_options]
minversion = "6.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers -n auto --cov=src/polus/aithena/clinical_aithena --cov-report=term-missing"
markers = [
  "asyncio: marks tests as async",
]

[tool.coverage.run]
source = ["src/polus/aithena/clinical_aithena"]
omit = [
  # CLI command implementations are DB-operation-heavy glue code;
  # the underlying library functions they call ARE tested.
  "src/polus/aithena/clinical_aithena/cli/commands/initdb.py",
  "src/polus/aithena/clinical_aithena/cli/commands/updatedb.py",
  "src/polus/aithena/clinical_aithena/cli/commands/transform.py",
  "src/polus/aithena/clinical_aithena/cli/commands/embed.py",
  "src/polus/aithena/clinical_aithena/cli/commands/diff_study.py",
  "src/polus/aithena/clinical_aithena/cli/commands/config.py",
  # RabbitMQ integration (requires running broker)
  "src/polus/aithena/clinical_aithena/rabbit.py",
]
