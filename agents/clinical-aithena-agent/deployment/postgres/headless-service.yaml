apiVersion: v1
kind: Service
metadata:
  name: clinical-aithena-db
  namespace: clinical-aithena
  labels:
    app: clinical-aithena-db
spec:
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: clinical-aithena-db
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  # This creates DNS records:
  # clinical-aithena-db-0.clinical-aithena-db.clinical-aithena.svc.cluster.local

