apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinical-aithena-api
  namespace: clinical-aithena
  labels:
    app: clinical-aithena-api
    component: api
spec:
  replicas: 1  # Run 2 replicas for high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Ensure zero-downtime deployments
  selector:
    matchLabels:
      app: clinical-aithena-api
  template:
    metadata:
      labels:
        app: clinical-aithena-api
        component: api
    spec:
      containers:
      - name: api
        image: polusai/ctaithena-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        # Resource allocation
        resources:
          limits:
            cpu: "4"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: clinical-aithena-api-config
        
        # Environment variables from Secret
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: clinical-aithena-api-secret
              key: database_url
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: clinical-aithena-api-secret
              key: llm_api_key
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: clinical-aithena-api-secret
              key: llm_api_key
        
        # Health checks
        # Note: The patient matching pipeline can run for 3-5 minutes.
        # During heavy LLM calls the health endpoint may be slow to respond.
        # Use generous thresholds to avoid killing pods mid-pipeline.
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 15
          failureThreshold: 12  # ~3 minutes before kill
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6  # ~1 minute before unready
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Pod-level security context
      securityContext:
        fsGroup: 1000
      
      # DNS configuration
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      
      # Affinity rules to spread pods across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - clinical-aithena-api
              topologyKey: kubernetes.io/hostname

