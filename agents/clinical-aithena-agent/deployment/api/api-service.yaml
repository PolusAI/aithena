apiVersion: v1
kind: Service
metadata:
  name: clinical-aithena-api
  namespace: clinical-aithena
  labels:
    app: clinical-aithena-api
    component: api
spec:
  type: ClusterIP  # Internal cluster access only
  ports:
  - port: 80          # Service port (external)
    targetPort: 8000  # Container port (internal)
    protocol: TCP
    name: http
  selector:
    app: clinical-aithena-api
  sessionAffinity: None

---
